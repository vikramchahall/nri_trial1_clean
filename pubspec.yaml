name: nri_trial1_clean
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6


  flutter_localizations:
    sdk: flutter

  razorpay_flutter: 1.4.0
  image: ^4.1.3
  intl: 0.18.1
  url_launcher: ^6.3.0
  video_player: ^2.8.1
  flutter_local_notifications: ^16.3.0

  flutter_bloc: ^8.1.3
  supabase_flutter: ^2.3.4
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # 🔥 FIREBASE + FCM
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # 🔥 REQUIRED FOR FCM API v1
  http: ^1.2.0
  googleapis_auth: ^1.4.1
  font_awesome_flutter: ^10.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: 2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/service_account.json   # ✅ REQUIRED

# 🔥 APP ICON CONFIG
flutter_icons:
  android: true
  ios: true
  image_path: assets/logo.png

# 🔥 SPLASH SCREEN CONFIG
flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android: true
  ios: true
